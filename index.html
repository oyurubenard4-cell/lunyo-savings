<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watek Ki Lwak Savings</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif} .wa-bubble{background:#dcf8c6;border-radius:7.5px 0 7.5px 7.5px}.wa-bubble-admin{background:#fff;border-radius:0 7.5px 7.5px 7.5px}</style>
</head>
<body class="bg-[#111b21] min-h-screen">
<div class="max-w-md mx-auto bg-[#efeae2] min-h-screen shadow-2xl flex flex-col">

<!-- Header like WhatsApp -->
<div class="bg-[#075E54] text-white p-3 flex items-center justify-between sticky top-0 z-10">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-[#128C7E] rounded-full flex items-center justify-center font-bold">W</div>
<div><h1 class="font-bold text-[16px]">Watek Ki Lwak Savings</h1><p class="text-[11px] opacity-80" id="memberCount">3 members • Secure</p></div>
</div>
<button id="adminBtn" class="bg-[#128C7E] px-3 py-1 rounded-full text-xs">Admin Login</button>
<button id="logoutBtn" class="hidden bg-red-600 px-3 py-1 rounded-full text-xs">Logout</button>
</div>

<!-- Savings Summary Card -->
<div class="bg-white m-3 p-4 rounded-lg shadow">
<div class="flex justify-between items-center">
<div><p class="text-xs text-gray-500">Grand Total Savings</p><h2 id="grandTotal" class="text-2xl font-bold text-[#075E54]">xxxxx</h2><p id="totalHint" class="text-[10px] text-gray-400">Login as admin to view</p></div>
<div class="text-right"><p class="text-xs text-gray-500">This Month</p><p id="monthTotal" class="font-bold">UGX 0</p></div>
</div>
<button id="shareBtn" class="hidden mt-3 w-full bg-[#25D366] text-white py-2 rounded-full text-sm font-semibold">📤 Share Report via WhatsApp</button>
</div>

<!-- Tabs -->
<div class="flex bg-white border-b">
<button onclick="showTab('chat')" id="tabChat" class="flex-1 py-3 font-bold text-[#075E54] border-b-2 border-[#075E54]">💬 MESSAGES</button>
<button onclick="showTab('savings')" id="tabSavings" class="flex-1 py-3 text-gray-500">💰 SAVINGS</button>
</div>

<!-- CHAT TAB - WhatsApp Style -->
<div id="chatTab" class="flex-1 flex flex-col bg-[#e5ddd5] bg-[url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')]">

<div id="messagesList" class="flex-1 p-3 space-y-2 overflow-y-auto pb-20">
<!-- Messages will appear here -->
</div>

<!-- Message Input - Only Admin -->
<div id="msgInputArea" class="hidden bg-[#f0f0f0] p-2 flex gap-2 sticky bottom-0">
<input id="msgInput" placeholder="Type a message to group..." class="flex-1 rounded-full px-4 py-2 text-sm outline-none">
<button id="sendMsg" class="bg-[#075E54] text-white w-10 h-10 rounded-full">➤</button>
</div>
<div id="msgLoginHint" class="bg-[#f0f0f0] p-3 text-center text-xs text-gray-500 sticky bottom-0">Only admin can post messages. Members can read.</div>
</div>

<!-- SAVINGS TAB -->
<div id="savingsTab" class="hidden flex-1 bg-white p-3 overflow-y-auto">
<div id="adminEntry" class="hidden bg-gray-50 p-3 rounded-lg mb-3">
<h3 class="font-bold text-sm mb-2">Add Savings (Admin)</h3>
<select id="memberSelect" class="w-full p-2 border rounded mb-2 text-sm"><option>Benard Oyuru</option><option>Okello John</option><option>Apio Sarah</option></select>
<input id="amountInput" type="number" placeholder="Amount UGX" class="w-full p-2 border rounded mb-2 text-sm">
<button id="addSaving" class="w-full bg-[#075E54] text-white py-2 rounded text-sm">Add Saving</button>
</div>
<div id="savingsList" class="space-y-2"></div>
</div>

</div>

<!-- Admin Login Modal -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
<div class="bg-white rounded-lg p-5 w-full max-w-sm"><h3 class="font-bold mb-3">Admin Login</h3><input id="passInput" type="password" placeholder="Password" class="w-full p-2 border rounded mb-3"><p class="text-xs text-gray-400 mb-3">Hint: watek2024</p><div class="flex gap-2"><button id="loginSubmit" class="flex-1 bg-[#075E54] text-white py-2 rounded">Login</button><button onclick="document.getElementById('loginModal').classList.add('hidden')" class="flex-1 bg-gray-200 py-2 rounded">Cancel</button></div></div>
</div>

<script>
// --- CONFIG ---
const ADMIN_PASS = "watek2024";
let isAdmin = localStorage.getItem('watek_admin')==='yes';
let savings = JSON.parse(localStorage.getItem('watek_savings')||'[]');
let messages = JSON.parse(localStorage.getItem('watek_msgs')||'[{"text":"Welcome to Watek Ki Lwak Savings Group! 🙏 Your savings are safe here. Admin will post updates here like WhatsApp.","time":"09:22","sender":"Admin","isAdmin":true}]');

// Init
updateUI();
renderMessages();
renderSavings();

function updateUI(){
 if(isAdmin){
  document.getElementById('grandTotal').innerText = 'UGX ' + savings.reduce((a,b)=>a+Number(b.amount),0).toLocaleString();
  document.getElementById('totalHint').innerText = 'Admin view • Real total';
  document.getElementById('shareBtn').classList.remove('hidden');
  document.getElementById('adminEntry').classList.remove('hidden');
  document.getElementById('msgInputArea').classList.remove('hidden');
  document.getElementById('msgLoginHint').classList.add('hidden');
  document.getElementById('adminBtn').classList.add('hidden');
  document.getElementById('logoutBtn').classList.remove('hidden');
 } else {
  document.getElementById('grandTotal').innerText = 'xxxxx';
  document.getElementById('totalHint').innerText = 'Login as admin to view';
 }
}

function showTab(t){
 if(t==='chat'){document.getElementById('chatTab').classList.remove('hidden');document.getElementById('savingsTab').classList.add('hidden');document.getElementById('tabChat').className='flex-1 py-3 font-bold text-[#075E54] border-b-2 border-[#075E54]';document.getElementById('tabSavings').className='flex-1 py-3 text-gray-500';}else{document.getElementById('chatTab').classList.add('hidden');document.getElementById('savingsTab').classList.remove('hidden');document.getElementById('tabSavings').className='flex-1 py-3 font-bold text-[#075E54] border-b-2 border-[#075E54]';document.getElementById('tabChat').className='flex-1 py-3 text-gray-500';}
}

function renderMessages(){
 const list = document.getElementById('messagesList');
 list.innerHTML = messages.map(m=>`
  <div class="flex ${m.isAdmin?'justify-start':'justify-end'}">
   <div class="${m.isAdmin?'wa-bubble-admin':'wa-bubble'} max-w-[80%] p-2 px-3 shadow-sm relative">
    ${m.isAdmin?`<p class="text-[11px] font-bold text-[#075E54]">${m.sender}</p>`:''}
    <p class="text-[13.5px] leading-[19px] whitespace-pre-wrap">${m.text}</p>
    <p class="text-[10px] text-gray-500 text-right mt-1">${m.time} ${m.isAdmin?'':'✓✓'}</p>
   </div>
  </div>
 `).join('');
 list.scrollTop = list.scrollHeight;
}

function renderSavings(){
 const list = document.getElementById('savingsList');
 if(savings.length===0){list.innerHTML='<p class="text-center text-sm text-gray-400 py-10">No savings yet</p>';return;}
 let total = savings.reduce((a,b)=>a+Number(b.amount),0);
 document.getElementById('monthTotal').innerText='UGX '+total.toLocaleString();
 list.innerHTML = savings.slice().reverse().map((s,i)=>`
  <div class="bg-gray-50 p-3 rounded flex justify-between text-sm"><div><p class="font-semibold">${s.member}</p><p class="text-xs text-gray-500">${s.date}</p></div><p class="font-bold text-[#075E54]">UGX ${Number(s.amount).toLocaleString()}</p></div>
 `).join('');
}

// Events
document.getElementById('adminBtn').onclick=()=>document.getElementById('loginModal').classList.remove('hidden');
document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('watek_admin');location.reload();};
document.getElementById('loginSubmit').onclick=()=>{
 if(document.getElementById('passInput').value===ADMIN_PASS){localStorage.setItem('watek_admin','yes');location.reload();}else{alert('Wrong password!');}
};
document.getElementById('addSaving').onclick=()=>{
 let m=document.getElementById('memberSelect').value, a=document.getElementById('amountInput').value;
 if(!a)return alert('Enter amount');
 savings.push({member:m,amount:a,date:new Date().toLocaleDateString()});
 localStorage.setItem('watek_savings',JSON.stringify(savings));
 document.getElementById('amountInput').value='';renderSavings();updateUI();
};
document.getElementById('sendMsg').onclick=sendMessage;
document.getElementById('msgInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendMessage();});

function sendMessage(){
 let input=document.getElementById('msgInput');
 let text=input.value.trim();
 if(!text)return;
 let now=new Date();let time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
 messages.push({text:text,time:time,sender:'Admin',isAdmin:true});
 localStorage.setItem('watek_msgs',JSON.stringify(messages));
 input.value='';renderMessages();
}

document.getElementById('shareBtn').onclick=()=>{
 let total=savings.reduce((a,b)=>a+Number(b.amount),0);
 let txt=`*Watek Ki Lwak Savings Report*%0A%0ATotal: UGX ${total.toLocaleString()}%0A%0A${savings.map(s=>`${s.member}: ${s.amount}`).join('%0A')}`;
 window.open(`https://wa.me/?text=${txt}`,'_blank');
};

// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
