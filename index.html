<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watek Ki Lwak Savings</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f1f5f9} .header{background:#0f172a;color:white;padding:16px;display:flex;justify-content:space-between;position:sticky;top:0}
.logo{font-weight:900;color:#4ade80} .btn{border:none;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-green{background:#16a34a;color:white} .card{background:white;margin:12px;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.grand-total{background:#0f172a;color:#4ade80;text-align:center;font-size:22px;font-weight:900;padding:18px;border-radius:14px}
.member-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #f1f5f9}
.input{width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:12px;margin:8px 0;font-size:16px}
.hidden{display:none} .badge{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:12px}
.install-banner{background:#16a34a;color:white;padding:12px;text-align:center;position:sticky;top:0;z-index:20}
</style>
</head>
<body>
<div id="installBanner" class="install-banner hidden">📲 Tap ⋮ menu → Install app <button onclick="installPWA()" class="btn" style="background:white;color:#16a34a;margin-left:8px">Install</button></div>
<div class="header"><div class="logo">WATEK KI LWAK</div><div><button id="loginBtn" class="btn btn-green" onclick="showLogin()">Login</button><button id="logoutBtn" class="btn hidden" onclick="logout()">Logout</button></div></div>

<div class="card"><div class="grand-total">GRAND TOTAL IS <span id="grandTotal">xxxxx</span><div style="font-size:12px;color:#94a3b8;margin-top:6px;font-weight:400" id="grandTotalHint">Login as admin</div></div></div>

<div id="loginModal" class="card hidden" style="position:fixed;top:20%;left:5%;right:5%;z-index:30;max-width:400px;margin:auto">
<h3>Login</h3><select id="loginRole" class="input"><option value="member">Member</option><option value="admin">Admin</option></select>
<input id="loginName" class="input" placeholder="Name (e.g. Bernard)" /><input id="loginPass" class="input" type="password" placeholder="Admin Pass: watek2024" />
<button class="btn btn-green" style="width:100%" onclick="doLogin()">Login</button><button class="btn" style="width:100%;margin-top:8px" onclick="hideLogin()">Cancel</button></div>

<div id="memberView" class="hidden"><div class="card"><h3>Welcome <span id="memberName"></span></h3><div style="margin-top:12px;background:#f0fdf4;padding:14px;border-radius:12px"><div style="color:#64748b;font-size:13px">YOUR TOTAL SAVINGS</div><div style="font-size:28px;font-weight:900;color:#16a34a" id="mySavings">0 UGX</div></div></div><div class="card"><h4>Your Record</h4><div id="myRecords"></div></div></div>

<div id="adminView" class="hidden"><div class="card"><h3>Admin Dashboard</h3><input id="searchMember" class="input" placeholder="🔍 Search member to show record..." onkeyup="adminSearch(this.value)" /><div id="adminMemberList"></div></div><div class="card"><h4>Add Savings</h4><input id="addName" class="input" placeholder="Member Name" /><input id="addAmount" class="input" type="number" placeholder="Amount" /><button class="btn btn-green" style="width:100%" onclick="addSavings()">Add</button></div><div class="card"><h4>All Members</h4><div id="allMembers"></div></div></div>

<div id="publicView"><div class="card"><h4>About</h4><p style="color:#64748b;font-size:14px">Members login to see your savings. Grand total hidden (xxxxx). Tap link to install app like WhatsApp.</p><button class="btn btn-green" style="width:100%;margin-top:12px" onclick="showLogin()">Login</button></div></div>

<script>
let membersData=JSON.parse(localStorage.getItem('watek_members')||JSON.stringify([{name:"Bernard",phone:"0771234567",savings:[{date:"2026-10-20",amount:50000},{date:"2026-11-01",amount:30000}]},{name:"Akello",phone:"0782345678",savings:[{date:"2026-10-25",amount:40000}]}]));
const ADMIN_PASSWORD="watek2024"; let currentUser=JSON.parse(localStorage.getItem('watek_user')||'null'); let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').classList.remove('hidden');});
function installPWA(){if(deferredPrompt)deferredPrompt.prompt();else alert('Menu ⋮ → Add to Home Screen');}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
function showLogin(){document.getElementById('loginModal').classList.remove('hidden');}function hideLogin(){document.getElementById('loginModal').classList.add('hidden');}
function doLogin(){const role=document.getElementById('loginRole').value;const name=document.getElementById('loginName').value.trim();const pass=document.getElementById('loginPass').value;if(role==='admin'){if(pass!==ADMIN_PASSWORD){alert('Wrong!');return;}currentUser={role:'admin',name:'Admin';}}else{let found=membersData.find(m=>m.name.toLowerCase()===name.toLowerCase());if(!found){alert('Not found');return;}currentUser={role:'member',name:found.name};}localStorage.setItem('watek_user',JSON.stringify(currentUser));hideLogin();render();}
function logout(){localStorage.removeItem('watek_user');currentUser=null;render();}
function render(){const isAdmin=currentUser&&currentUser.role==='admin';const isMember=currentUser&&currentUser.role==='member';const total=membersData.reduce((s,m)=>s+m.savings.reduce((a,r)=>a+r.amount,0),0);const gt=document.getElementById('grandTotal');if(isAdmin){gt.innerText=total.toLocaleString()+' UGX';gt.style.letterSpacing='1px';}else{gt.innerText='xxxxx';gt.style.letterSpacing='6px';}document.getElementById('loginBtn').classList.toggle('hidden',!!currentUser);document.getElementById('logoutBtn').classList.toggle('hidden',!currentUser);document.getElementById('publicView').classList.toggle('hidden',!!currentUser);document.getElementById('memberView').classList.toggle('hidden',!isMember);document.getElementById('adminView').classList.toggle('hidden',!isAdmin);if(isMember)renderMember(currentUser.name);if(isAdmin)renderAdmin();}
function renderMember(name){const m=membersData.find(x=>x.name===name);const tot=m.savings.reduce((s,r)=>s+r.amount,0);document.getElementById('memberName').innerText=m.name;document.getElementById('mySavings').innerText=tot.toLocaleString()+' UGX';document.getElementById('myRecords').innerHTML=m.savings.map(r=>`<div class="member-row"><span>${r.date}</span><b>${r.amount.toLocaleString()}</b></div>`).join('');}
function renderAdmin(){document.getElementById('allMembers').innerHTML=membersData.map(m=>{const t=m.savings.reduce((s,r)=>s+r.amount,0);return `<div class="member-row"><span><b>${m.name}</b></span><span><b>${t.toLocaleString()}</b> <button class="btn btn-green" style="padding:4px 8px;font-size:11px" onclick="showStatement('${m.name}')">Show</button></span></div>`;}).join('');}
function adminSearch(q){if(!q){document.getElementById('adminMemberList').innerHTML='';return;}const f=membersData.filter(m=>m.name.toLowerCase().includes(q.toLowerCase()));document.getElementById('adminMemberList').innerHTML=f.map(m=>{const t=m.savings.reduce((s,r)=>s+r.amount,0);return `<div class="card" style="margin:8px 0"><b>${m.name}</b> - ${t.toLocaleString()} UGX<br>${m.savings.map(r=>r.date+': '+r.amount.toLocaleString()).join('<br>')}<br><button class="btn btn-green" style="margin-top:8px;width:100%" onclick="shareStatement('${m.name}')">📤 Share to Member via WhatsApp</button></div>`;}).join('');}
function showStatement(name){const m=membersData.find(x=>x.name===name);const t=m.savings.reduce((s,r)=>s+r.amount,0);alert(`STATEMENT\n${m.name}\n${m.savings.map(r=>r.date+': '+r.amount).join('\n')}\nTOTAL: ${t}`);}
function shareStatement(name){const m=membersData.find(x=>x.name===name);const t=m.savings.reduce((s,r)=>s+r.amount,0);const text=`*WATEK STATEMENT*\nMember: ${m.name}\nTotal: ${t.toLocaleString()} UGX\n${m.savings.map(r=>r.date+': '+r.amount).join('\n')}`;window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');}
function addSavings(){const name=document.getElementById('addName').value.trim();const amount=parseInt(document.getElementById('addAmount').value);if(!name||!amount)return alert('Enter');let m=membersData.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!m){m={name:name,phone:'',savings:[]};membersData.push(m);}m.savings.push({date:new Date().toISOString().slice(0,10),amount:amount});localStorage.setItem('watek_members',JSON.stringify(membersData));alert('Added');location.reload();}
render();
</script>
</body>
</html>
