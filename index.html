<html>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body style="font-family:system-ui;background:#eef2f7;margin:0;padding:10px">
<div style="background:linear-gradient(90deg,#0284c7,#16a34a);color:#fff;padding:14px;text-align:center;border-radius:12px;font-weight:900;position:sticky;top:0;z-index:10">
☁️ REAL APP LIVE • ID: 9a760c9d • v9-FINAL<br>
<small id="status">Connecting...</small>
</div>
<div style="background:#fff;border-radius:14px;padding:16px;margin:12px 0;text-align:center">
<div id="grand" style="font-size:32px;font-weight:900;color:#0284c7">GRAND TOTAL IS ...</div>
<div style="font-size:11px;color:#666">Auto-sync like WhatsApp • No refresh needed</div>
</div>
<div style="background:#fff;border-radius:14px;padding:16px;margin:12px 0">
<input id="name" placeholder="Full Name" style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box">
<input id="phone" placeholder="Phone" style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box">
<input id="amt" type="number" placeholder="Amount" style="width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box">
<button onclick="addMember()" style="background:#0284c7;color:#fff;border:none;padding:14px;width:100%;border-radius:10px;font-weight:800;font-size:16px">💾 SAVE - Everyone Sees Instantly</button>
</div>
<div style="background:#fff;border-radius:14px;padding:16px;margin:12px 0">
<h3 style="margin:0 0 10px">Live Members (<span id="count">0</span>)</h3>
<div id="list">Loading Real Cloud...</div>
</div>
<script>
// FORCE REMOVE OLD SERVICE WORKERS AND CACHE - Like WhatsApp update
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister()));}
if(window.caches){caches.keys().then(k=>k.forEach(n=>caches.delete(n)));}
localStorage.clear(); sessionStorage.clear();

const firebaseConfig={apiKey:"AIzaSyCRTAwmD87np-5RDm1E73hKqOj262e-XzI",authDomain:"watek-ki-lwak.firebaseapp.com",databaseURL:"https://watek-ki-lwak-default-rtdb.firebaseio.com",projectId:"watek-ki-lwak",storageBucket:"watek-ki-lwak.firebasestorage.app",messagingSenderId:"209092145807",appId:"1:209092145807:web:6678121395351ea41036fa"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const PATH="clouds/9a760c9d-9c42-401a-b381-5dc9a65d79a3/members";
let members=[];
db.ref(PATH).on('value',snap=>{
  const val=snap.val(); members=val?Object.values(val):[];
  let total=0; const list=document.getElementById('list'); list.innerHTML="";
  members.forEach(m=>{total+=parseInt(m.amount||0); list.innerHTML+=`<div style='display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee'><span><b>${m.name}</b><br><small>${m.phone}</small></span><b style='color:#0284c7'>${Number(m.amount).toLocaleString()}</b></div>`;});
  document.getElementById('grand').innerText="GRAND TOTAL IS "+total.toLocaleString();
  document.getElementById('count').innerText=members.length;
  document.getElementById('status').innerText="✅ REAL APP LIVE • "+members.length+" members • Online Now • Instant Sync";
},err=>{document.getElementById('status').innerText="❌ Rules Error - Set Rules to true";});
function addMember(){
  const name=document.getElementById('name').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const amount=document.getElementById('amt').value.trim();
  if(!name||!phone||!amount){alert("Fill all");return;}
  db.ref(PATH+"/"+Date.now()).set({id:Date.now(),name,phone,amount:parseInt(amount)}).then(()=>{
    alert("✅ Saved! Everyone will see it NOW!");
    document.getElementById('name').value="";document.getElementById('phone').value="";document.getElementById('amt').value="";
  });
}
</script>
